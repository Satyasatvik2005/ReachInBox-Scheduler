services:
  # 1. Backend API & Worker
  - type: web
    name: reachinbox-backend
    env: node
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: reachinbox-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: reachinbox-redis
          property: port
      - key: SMTP_HOST
        value: smtp.ethereal.email
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: tdfes4iszs2jryk2@ethereal.email # Ethereal User
      - key: SMTP_PASS
        value: kRqT31uJpKsaWDB5ZW # Ethereal Pass
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MIN_DELAY_MS
        value: 2000
      - key: MAX_EMAILS_PER_HOUR
        value: 200

  # 2. Frontend Dashboard
  - type: web
    name: reachinbox-frontend
    env: node
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: reachinbox-backend
          property: url
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        value: your_google_client_id_here

databases:
  - name: reachinbox-db
    databaseName: reachinbox
    user: reachinbox_user
    plan: free

  - name: reachinbox-redis
    type: redis
    plan: free
